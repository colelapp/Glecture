<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="contact-form">

        <h2>WE'RE HAPPY TO HEAR FROM YOU</h2>

        <form action="#">

            <div class="row">
Name</label>
                <input type="text" id="name" placeholder="Your name">
            </div>

            <div class="row">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Your email">
            </div>

            <div class="row">
                <label for="find-us">How did you find us?</label>

                <select id="find-us">
                    <option>Friends</option>
                    <option>Google</option>
                    <option>Advertisement</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="row">
                <label for="newsletter">Newsletter?</label>

                <div>
                    <input type="checkbox" id="newsletter" checked>
                    Yes, please
                </div>
            </div>

            <div class="row">
                <label for="message">Drop us a line</label>
                <textarea id="message" placeholder="Your message"></textarea>
            </div>

            <div class="row">
                <label>&nbsp;</label>
                <input type="submit" value="Send it!">
            </div>

        </form>

    </section>

    <footer class="footer">

        <div class="footer-links">

            <div class="left-links">
                #About us</a>
                #Blog</a>
                #Press</a>
                #iOS App</a>
                #Android App</a>
            </div>

            <div class="social-links">
                #Facebook</a>
                #Twitter</a>
                #YouTube</a>
                #Instagram</a>
            </div>

        </div>

        <p>
            Built with love in the beautiful city of Lisbon, Portugal, March 2015.
        </p>

    </footer>
    

</body>
</html>
        <style>
 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.contact-form {
    width: 70%;
    margin: 143px auto;
}

h2 {
    text-align: center;
    color: #666;
    font-weight: 300;
    font-size: 40px;
    margin-bottom: 30px;
}

.row {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
}

.row label {
    width: 35%;
}

.row input[type="text"],
.row input[type="email"],
.row select,
.row textarea {
    width: 65%;
    padding: 7px;
    border: 1px solid #ccc;
    border-radius: 3px;
}

textarea {
    height: 100px;
}

input[type="checkbox"] {
    margin-right: 5px;
}

*:focus {
    outline: none;
}

input[type="submit"] {
    background-color: #e67e22;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 25px;
    cursor: pointer;
}

input[type="submit"]:hover {
    background-color: #cf6d17;
}

.footer {
    background-color: #333;
    padding: 40px;
    margin-top: 60px;
}

.footer-links {
    display: flex;
    justify-content: space-between;
}

.left-links a,
.social-links a {
    color: #888;
    text-decoration: none;
    margin-right: 20px;
}

.left-links a:hover,
.social-links a:hover {
    color: white;
}

.footer  {
    text-align: bottom;
    color: #888;
    margin-top: 40px;
    footer {
    height: 15px;
}
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.contact-form {
    flex: 1;
}
.footer {
    background-color: #333;
    width: 100%;
    padding: 40px;
    margin-top: auto;
}
}

        </style>
</head>

</html>
